<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notion Progress Widget</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Prompt:wght@400;500;600&display=swap');

  :root{
    --primary:#9e3640;
    --primary-soft:#f3e3e4;
    --success:#2f8f5b;
    --success-soft:#e1f2e8;
    --gold:#e8b954;
    --track:#f0ede9;
    --text-main:#37352f;
    --text-sub:#9b9895;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans','Prompt',sans-serif;}
  body{
    background:transparent;
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:10px;
  }

  .card{
    background:var(--bg);
    width:100%;max-width:260px;
    padding:22px 20px 20px;
    border-radius:18px;
    box-shadow:0 6px 24px rgba(0,0,0,0.05);
    border:1px solid rgba(0,0,0,0.06);
    text-align:center;
    position:relative;
    overflow:hidden;
    transition:box-shadow .25s ease;
  }
  .card.pulse{ animation:cardPulse 900ms ease; }
  @keyframes cardPulse{
    0%{box-shadow:0 6px 24px rgba(0,0,0,0.05);}
    35%{box-shadow:0 0 0 6px var(--success-soft), 0 10px 28px rgba(47,143,91,0.25);}
    100%{box-shadow:0 6px 24px rgba(0,0,0,0.05);}
  }

  /* ambient floating celebration, contained inside the card, only while complete */
  .sparkle-layer{
    position:absolute;inset:0;
    pointer-events:none;
    overflow:hidden;
    border-radius:18px;
    z-index:1;
    display:none;
  }
  .card.complete .sparkle-layer{ display:block; }
  .spark{
    position:absolute;
    bottom:-12px;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--success);
    opacity:0;
    animation:floatUp 3.6s ease-in infinite;
  }
  .spark:nth-child(1){ left:8%;  width:5px;height:5px; background:var(--gold);   animation-delay:0s;    animation-duration:3.2s; }
  .spark:nth-child(2){ left:20%; width:7px;height:7px; background:var(--success);animation-delay:.5s;   animation-duration:4s; }
  .spark:nth-child(3){ left:34%; width:4px;height:4px; background:var(--gold);   animation-delay:1.1s;  animation-duration:3s; }
  .spark:nth-child(4){ left:48%; width:6px;height:6px; background:var(--success);animation-delay:.2s;   animation-duration:3.8s; }
  .spark:nth-child(5){ left:62%; width:5px;height:5px; background:var(--gold);   animation-delay:1.6s;  animation-duration:3.3s; }
  .spark:nth-child(6){ left:75%; width:7px;height:7px; background:var(--success);animation-delay:.8s;   animation-duration:4.2s; }
  .spark:nth-child(7){ left:88%; width:4px;height:4px; background:var(--gold);   animation-delay:1.9s;  animation-duration:3s; }
  .spark:nth-child(8){ left:56%; width:5px;height:5px; background:var(--success);animation-delay:2.3s;  animation-duration:3.6s; }
  @keyframes floatUp{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    12%{ opacity:.85; }
    85%{ opacity:.5; }
    100%{ transform:translateY(-220px) scale(1); opacity:0; }
  }

  /* settings icon: hidden until hover */
  .settings-icon{
    position:absolute;top:10px;right:10px;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    border-radius:8px;
    cursor:pointer;color:var(--text-sub);
    opacity:0;transform:translateY(-4px);
    transition:opacity .18s ease, transform .18s ease, background .18s ease, color .18s ease;
    pointer-events:none;
    z-index:3;
  }
  .card:hover .settings-icon,
  .card:focus-within .settings-icon{
    opacity:1;transform:translateY(0);pointer-events:auto;
  }
  .settings-icon:hover{ background:var(--track); color:var(--primary); }
  .settings-icon svg{ width:15px;height:15px; }

  .title{
    position:relative; z-index:2;
    font-size:13px;font-weight:600;letter-spacing:.02em;
    color:var(--text-sub);
    text-transform:uppercase;
    margin-bottom:16px;
  }

  /* circular progress */
  .progress-container{
    position:relative; z-index:2;
    width:132px;height:132px;
    margin:0 auto 18px;
  }
  .progress-container svg{ width:100%;height:100%; position:relative; z-index:2; }
  .circle-bg{ fill:none; stroke:var(--track); stroke-width:7; }
  .circle-progress{
    fill:none; stroke:var(--primary); stroke-width:7;
    stroke-linecap:round;
    transform:rotate(-90deg); transform-origin:50% 50%;
    stroke-dasharray:283; stroke-dashoffset:283;
    transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1), stroke .3s ease;
  }
  .tick{ fill:var(--primary); transition:fill .3s ease; }

  .percent-text{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-size:32px;font-weight:800;color:var(--text-main);
    letter-spacing:-0.02em;
    z-index:2;
    transition:color .3s ease;
  }
  .done-text{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(.6);
    font-size:22px;font-weight:800;letter-spacing:.06em;
    color:var(--success);
    text-transform:uppercase;
    opacity:0;
    z-index:2;
    pointer-events:none;
  }

  .controls{ position:relative; z-index:2; display:flex;justify-content:center;gap:14px; }
  .btn{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--primary);
    background:transparent;color:var(--primary);
    font-size:16px;font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, background .15s ease, color .15s ease, border-color .3s ease;
  }
  .btn:hover{ background:var(--primary); color:#fff; }
  .btn:active{ transform:scale(0.88); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn:disabled:hover{ background:transparent; color:var(--primary); }

  .card.complete .circle-progress{ stroke:var(--success); }
  .card.complete .percent-text{ opacity:0; }
  .card.complete .done-text{ opacity:1; transform:translate(-50%,-50%) scale(1); transition:opacity .35s cubic-bezier(.34,1.56,.64,1), transform .35s cubic-bezier(.34,1.56,.64,1); }
  .card.complete .btn{ border-color:var(--success); color:var(--success); }
  .card.complete .btn:hover{ background:var(--success); color:#fff; }

  /* settings panel */
  .settings-panel{
    display:none;
    position:absolute;inset:0;
    background:rgba(255,255,255,0.99);
    border-radius:18px;
    padding:18px;
    flex-direction:column;justify-content:center;gap:9px;
    text-align:left;
    z-index:10;
  }
  .settings-panel.active{ display:flex; }
  .settings-panel label{
    font-size:10.5px;font-weight:600;color:var(--text-sub);
    text-transform:uppercase;letter-spacing:.03em;
    margin-top:2px;
  }
  .settings-panel input{
    padding:7px 8px;border:1.3px solid #e5e2de;border-radius:7px;
    font-size:12.5px;color:var(--text-main);
    outline:none;
  }
  .settings-panel input:focus{ border-color:var(--primary); }
  .settings-row{ display:flex;gap:8px; }
  .settings-row > div{ flex:1; }
  .save-btn{
    background:var(--primary);color:#fff;border:none;
    padding:8px;border-radius:7px;cursor:pointer;
    font-size:12.5px;font-weight:600;margin-top:8px;
    transition:opacity .15s ease;
  }
  .save-btn:hover{ opacity:.9; }
  .close-settings{
    position:absolute;top:10px;right:10px;
    width:22px;height:22px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text-sub);font-size:13px;
  }
  .close-settings:hover{ background:var(--track); }
</style>
</head>
<body>

  <div class="card" id="widgetCard" tabindex="0">
    <div class="sparkle-layer" id="sparkleLayer">
      <span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
      <span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
    </div>

    <div class="settings-icon" onclick="toggleSettings()" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </div>

    <div class="title" id="displayTitle">Progress</div>

    <div class="progress-container">
      <svg viewBox="0 0 100 100">
        <circle class="circle-bg" cx="50" cy="50" r="45"></circle>
        <circle class="circle-progress" id="progressCircle" cx="50" cy="50" r="45"></circle>
        <circle class="tick" id="tickMark" cx="50" cy="6" r="3"></circle>
      </svg>
      <div class="percent-text" id="percentText">0%</div>
      <div class="done-text" id="doneText">Done</div>
    </div>

    <div class="controls">
      <button class="btn" id="minusBtn" onclick="adjustValue(-STEP)">−</button>
      <button class="btn" id="plusBtn" onclick="adjustValue(STEP)">+</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="close-settings" onclick="toggleSettings()">✕</div>
      <label>Title</label>
      <input type="text" id="titleInput" value="Progress">

      <div class="settings-row">
        <div>
          <label>Current value</label>
          <input type="number" id="currentInput" value="0">
        </div>
        <div>
          <label>Max value</label>
          <input type="number" id="maxInput" value="10">
        </div>
      </div>

      <button class="save-btn" onclick="saveSettings()">Save</button>
    </div>
  </div>

<script>
  // ---------- persistence (falls back to memory if storage is blocked) ----------
  const memoryStore = {};
  function safeGet(key, fallback){
    try{
      const v = localStorage.getItem(key);
      return v === null ? fallback : v;
    }catch(e){ return key in memoryStore ? memoryStore[key] : fallback; }
  }
  function safeSet(key, val){
    try{ localStorage.setItem(key, val); }
    catch(e){ memoryStore[key] = val; }
  }

  const STEP = 1; // fixed step per click (step-per-click setting removed)

  let currentValue = parseInt(safeGet('notion_val', 0));
  let maxValue      = parseInt(safeGet('notion_max', 10));
  let widgetTitle   = safeGet('notion_title', 'Progress');

  const circle      = document.getElementById('progressCircle');
  const tick        = document.getElementById('tickMark');
  const percentText = document.getElementById('percentText');
  const doneText    = document.getElementById('doneText');
  const card        = document.getElementById('widgetCard');
  const minusBtn    = document.getElementById('minusBtn');
  const plusBtn     = document.getElementById('plusBtn');
  const circumference = 2 * Math.PI * 45;

  let wasComplete = false;

  // ---------- sound (generated, no external audio files needed) ----------
  let audioCtx;
  function ctx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, start, dur, type, gainPeak){
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, c.currentTime + start);
    gain.gain.linearRampToValueAtTime(gainPeak, c.currentTime + start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(c.currentTime + start);
    osc.stop(c.currentTime + start + dur + 0.02);
  }
  function playClick(){
    tone(520, 0, 0.09, 'sine', 0.11);
  }
  function playSuccess(){
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> tone(f, i*0.09, 0.28, 'triangle', 0.13));
  }

  function fireConfetti(){
    if(typeof confetti !== 'function') return;
    const rect = card.getBoundingClientRect();
    const origin = {
      x: (rect.left + rect.width/2) / window.innerWidth,
      y: (rect.top + rect.height*0.3) / window.innerHeight
    };
    confetti({
      particleCount: 60,
      spread: 60,
      startVelocity: 28,
      scalar: 0.75,
      ticks: 130,
      origin,
      colors: ['#2f8f5b', '#e8b954', '#e1f2e8', '#37352f']
    });
  }

  function updateWidget(playSound){
    if (currentValue > maxValue) currentValue = maxValue;
    if (currentValue < 0) currentValue = 0;

    // completion is derived straight from the values, not from a rounded percentage,
    // so it can't get stuck just shy of "done" due to rounding.
    const isComplete = maxValue > 0 && currentValue >= maxValue;
    const percentage = maxValue > 0 ? Math.min(100, Math.round((currentValue / maxValue) * 100)) : 0;

    const offset = circumference - (percentage / 100) * circumference;
    circle.style.strokeDashoffset = offset;

    // tick mark follows the arc's leading edge, hidden at 0% and 100%
    const angle = (percentage/100) * 360 - 90;
    const rad = angle * Math.PI/180;
    tick.setAttribute('cx', 50 + 45*Math.cos(rad));
    tick.setAttribute('cy', 50 + 45*Math.sin(rad));
    tick.style.opacity = (!isComplete && percentage > 0) ? 1 : 0;

    percentText.innerText = percentage + '%';
    document.getElementById('displayTitle').innerText = widgetTitle;

    minusBtn.disabled = currentValue <= 0;
    plusBtn.disabled = currentValue >= maxValue;

    if (isComplete) {
      card.classList.add('complete');
    } else {
      card.classList.remove('complete');
    }

    if (isComplete && !wasComplete) {
      // just crossed into completion
      card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse');
      fireConfetti();
      if (playSound) playSuccess();
    }
    wasComplete = isComplete;

    safeSet('notion_val', currentValue);
  }

  function adjustValue(amount){
    currentValue += amount;
    playClick();
    updateWidget(true);
  }

  function toggleSettings(){
    document.getElementById('titleInput').value = widgetTitle;
    document.getElementById('currentInput').value = currentValue;
    document.getElementById('maxInput').value = maxValue;
    document.getElementById('settingsPanel').classList.toggle('active');
  }

  function saveSettings(){
    widgetTitle  = document.getElementById('titleInput').value || 'Progress';
    currentValue = parseInt(document.getElementById('currentInput').value) || 0;
    maxValue     = Math.max(1, parseInt(document.getElementById('maxInput').value) || 10);

    safeSet('notion_title', widgetTitle);
    safeSet('notion_max', maxValue);

    document.getElementById('settingsPanel').classList.remove('active');
    updateWidget(false);
  }

  updateWidget(false);
</script>
</body>
</html>
